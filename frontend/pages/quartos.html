<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Quartos - Hotel Prime</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body { display: flex; font-family: sans-serif; margin: 0; }
        .sidebar {
            width: 220px;
            min-height: 100vh;
            background: #2d2a5e;
        }
        .logo-menu {
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
        }
        .menu a {
            display: block;
            padding: 15px 20px;
            color: white;
            text-decoration: none;
        }
        .menu a:hover { background: #403c7d; }
        .ativo { background: #403c7d; }
        .conteudo {
            flex: 1;
            padding: 30px;
            background: #f5f5f5;
        }
        .topo {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .btn {
            width: auto;
            padding: 10px 15px;
        }
        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 20px;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 5px rgba(0,0,0,.1);
        }
        .numero {
            font-size: 28px;
            font-weight: bold;
            margin-top: 10px;
        }
        table {
            width: 100%;
            background: white;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }
        th { background: #eee; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo-menu">Hotel</div>
        <div class="menu">
            <a href="dashboard.html">Dashboard</a>
            <a href="reservas.html">Reservas</a>
            <a href="hospedes.html">Hóspedes</a>
            <a href="quartos.html" class="ativo">Quartos</a>
            <a href="funcionarios.html">Funcionários</a>
            <a href="servicos.html">Serviços</a>
            <a href="financeiro.html">Financeiro</a>
        </div>
    </div>

    <div class="conteudo">
        <div class="topo">
            <h1>Quartos</h1>
            <button class="btn">Novo Quarto</button>
        </div>

        <div class="cards">
            <div class="card">
                Disponíveis
                <div class="numero" id="cardDisponiveis">0</div>
            </div>
            <div class="card">
                Ocupados
                <div class="numero" id="cardOcupados">0</div>
            </div>
            <div class="card">
                Manutenção
                <div class="numero" id="cardManutencao">0</div>
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Número</th>
                    <th>Tipo</th>
                    <th>Status</th>
                    <th>Valor/Noite</th>
                </tr>
            </thead>
            <tbody id="tabelaQuartos">
                <tr>
                    <td colspan="4">Carregando quartos...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div id="modalQuarto" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000;">
        <div style="background: white; padding: 30px; border-radius: 10px; width: 400px; box-shadow: 0 4px 15px rgba(0,0,0,0.2);">
            <h2 style="margin-top: 0; color: #2d2a5e;">Cadastrar Novo Quarto</h2>
            
            <form id="formQuarto">
                <div style="margin-bottom: 15px;">
                    <label style="display: block; margin-bottom: 5px; font-weight: bold;">Número do Quarto:</label>
                    <input type="number" id="numQuarto" required style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box;">
                </div>

                <div style="margin-bottom: 15px;">
                    <label style="display: block; margin-bottom: 5px; font-weight: bold;">Tipo:</label>
                    <select id="tipoQuarto" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
                        <option value="Standard">Standard</option>
                        <option value="Luxo">Luxo</option>
                        <option value="Premium">Premium</option>
                    </select>
                </div>

                <div style="margin-bottom: 15px;">
                    <label style="display: block; margin-bottom: 5px; font-weight: bold;">Status Inicial:</label>
                    <select id="statusQuarto" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
                        <option value="Disponível">Disponível</option>
                        <option value="Ocupado">Ocupado</option>
                        <option value="Manutenção">Manutenção</option>
                    </select>
                </div>

                <div style="margin-bottom: 20px;">
                    <label style="display: block; margin-bottom: 5px; font-weight: bold;">Valor da Diária (R$):</label>
                    <input type="number" step="0.01" id="valorQuarto" required style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box;">
                </div>

                <div style="display: flex; justify-content: space-between;">
                    <button type="button" id="btnFecharModal" style="background: #ccc; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer;">Cancelar</button>
                    <button type="submit" style="background: #2d2a5e; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer;">Salvar Quarto</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.querySelector(".topo .btn").id = "btnNovoQuarto";
    </script>
    <script src="../js/quartos.js"></script>
</body>
</html>
