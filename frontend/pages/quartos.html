<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Quartos - Hotel Prime</title>
	<link rel="stylesheet" href="../css/style.css">
</head>
<body>
	<div class="layout">
		<aside class="sidebar">
			<div class="logo-menu">Hotel Prime</div>
			<nav class="menu">
				<a href="dashboard.html">Dashboard</a>
				<a href="reservas.html">Reservas</a>
				<a href="hospedes.html">Hóspedes</a>
				<a href="quartos.html" class="ativo">Quartos</a>
				<a href="financeiro.html">Financeiro</a>
				<a href="funcionarios.html">Funcionários</a>
				<button type="button" onclick="sair()">Sair</button>
			</nav>
		</aside>

		<main class="conteudo">
			<div class="topo">
				<h1>Quartos</h1>
				<button class="btn" id="btnNovoQuarto">Novo Quarto</button>
			</div>

			<div class="cards">
				<div class="card">Disponíveis<div class="numero" id="cardDisponiveis">0</div></div>
				<div class="card">Limpeza<div class="numero" id="cardLimpeza">0</div></div>
				<div class="card">Manutenção<div class="numero" id="cardManutencao">0</div></div>
			</div>

			<table>
				<thead>
					<tr>
						<th>Número</th>
						<th>Andar</th>
						<th>Tipo</th>
						<th>Status</th>
						<th>Valor/Noite</th>
						<th>Ações</th>
					</tr>
				</thead>
				<tbody id="tabelaQuartos">
					<tr><td colspan="6">Carregando quartos...</td></tr>
				</tbody>
			</table>
		</main>
	</div>

	<div id="modalQuarto" class="modal">
		<div class="modal-conteudo">
			<h2 id="tituloModalQuarto">Cadastrar Quarto</h2>
			<form id="formQuarto">
				<input type="hidden" id="idQuarto">

				<div class="form-group">
					<label for="numeroQuarto">Número</label>
					<input type="text" id="numeroQuarto" required>
				</div>

				<div class="form-group">
					<label for="andarQuarto">Andar</label>
					<input type="number" id="andarQuarto" min="1" required>
				</div>

				<div class="form-group">
					<label for="tipoQuarto">Tipo de quarto</label>
					<select id="tipoQuarto" required></select>
				</div>

				<div class="form-group">
					<label for="estadoQuarto">Estado</label>
					<select id="estadoQuarto" required>
						<option value="disponivel">Disponível</option>
						<option value="limpeza">Limpeza</option>
						<option value="manutencao">Manutenção</option>
						<option value="desativado">Desativado</option>
					</select>
				</div>

				<div class="botoes-modal">
					<button type="button" class="btn-cancelar" id="btnFecharModalQuarto">Cancelar</button>
					<button type="submit" class="btn-salvar">Salvar</button>
				</div>
			</form>
		</div>
	</div>

	<script src="../js/api.js"></script>
	<script src="../js/quartos.js"></script>
</body>
</html>
