<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Quartos - Hotel Prime</title>

<link rel="stylesheet" href="../css/style.css">

<style>
body{display:flex}

.sidebar{
    width:220px;
    min-height:100vh;
    background:#2d2a5e;
}

.logo-menu{
    color:white;
    padding:20px;
    text-align:center;
    font-size:22px;
    font-weight:bold;
}

.menu a{
    display:block;
    padding:15px 20px;
    color:white;
    text-decoration:none;
}

.menu a:hover{
    background:#403c7d;
}

.ativo{
    background:#403c7d;
}

.conteudo{
    flex:1;
    padding:30px;
    background:#f5f5f5;
}

.topo{
    display:flex;
    justify-content:space-between;
    margin-bottom:20px;
}

.btn{
    width:auto;
    padding:10px 15px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
    margin-bottom:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 5px rgba(0,0,0,.1);
}

.numero{
    font-size:28px;
    font-weight:bold;
    margin-top:10px;
}

table{
    width:100%;
    background:white;
    border-collapse:collapse;
}

th,td{
    padding:12px;
    border-bottom:1px solid #ddd;
    text-align:left;
}

th{
    background:#eee;
}
</style>
</head>

<body>

<div class="sidebar">

    <div class="logo-menu">
        Hotel 
    </div>

    <div class="menu">
        <a href="dashboard.html">Dashboard</a>
        <a href="reservas.html">Reservas</a>
        <a href="hospedes.html">Hóspedes</a>
        <a href="quartos.html" class="ativo">Quartos</a>
        <a href="funcionarios.html">Funcionários</a>
        <a href="servicos.html">Serviços</a>
        <a href="financeiro.html">Financeiro</a>
    </div>

</div>

<div class="conteudo">

    <div class="topo">
        <h1>Quartos</h1>

        <button class="btn">
            Novo Quarto
        </button>
    </div>

    <div class="cards">

        <div class="card">
            Disponíveis
            <div class="numero">15</div>
        </div>

        <div class="card">
            Ocupados
            <div class="numero">8</div>
        </div>

        <div class="card">
            Manutenção
            <div class="numero">2</div>
        </div>

    </div>

    <table>

        <tr>
            <th>Número</th>
            <th>Tipo</th>
            <th>Status</th>
            <th>Valor/Noite</th>
        </tr>

        <tr>
            <td>101</td>
            <td>Standard</td>
            <td>Disponível</td>
            <td>R$ 120,00</td>
        </tr>

        <tr>
            <td>102</td>
            <td>Luxo</td>
            <td>Ocupado</td>
            <td>R$ 250,00</td>
        </tr>

        <tr>
            <td>103</td>
            <td>Premium</td>
            <td>Manutenção</td>
            <td>R$ 400,00</td>
        </tr>

    </table>

</div>

</body>
</html>
