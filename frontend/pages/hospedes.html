<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Hóspedes - Hotel Prime</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body { display: flex; font-family: sans-serif; margin: 0; }
        .sidebar {
            width: 220px;
            min-height: 100vh;
            background: #2d2a5e;
        }
        .logo-menu {
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
        }
        .menu a {
            display: block;
            padding: 15px 20px;
            color: white;
            text-decoration: none;
        }
        .menu a:hover { background: #403c7d; }
        .ativo { background: #403c7d; }
        .conteudo {
            flex: 1;
            padding: 30px;
            background: #f5f5f5;
        }
        .topo {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .btn {
            width: auto;
            padding: 10px 15px;
        }
        table {
            width: 100%;
            background: white;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }
        th {
            background: #eee;
            text-align: left;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo-menu">Hotel</div>
        <div class="menu">
            <a href="dashboard.html">Dashboard</a>
            <a href="reservas.html">Reservas</a>
            <a href="hospedes.html" class="ativo">Hóspedes</a>
            <a href="quartos.html">Quartos</a>
            <a href="funcionarios.html">Funcionários</a>
            <a href="servicos.html">Serviços</a>
            <a href="financeiro.html">Financeiro</a>
        </div>
    </div>

    <div class="conteudo">
        <div class="topo">
            <h1>Hóspedes</h1>
            <button class="btn">Novo Hóspede</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Telefone</th>
                    <th>Email</th>
                </tr>
            </thead>
            <tbody id="tabelaHospedes">
                <tr>
                    <td colspan="3">Carregando hóspedes...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script src="../js/hospedes.js"></script>
</body>
</html>
