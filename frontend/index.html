<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Hotel Prime</title>
	<link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
	<div class="login-card">
		<div class="logo">Hotel Prime</div>

		<div class="form-group">
			<label for="usuario">Funcionário</label>
			<input type="text" id="usuario" placeholder="Nome, e-mail ou telefone">
		</div>

        <div class="form-group">
			<label for="usuario-senha">// admin@hotel.com <br> // senha: 123</label>
		</div>

		<div class="form-group">
			<label for="senha">Senha</label>
			<input type="password" id="senha" placeholder="Digite sua senha">
		</div>

		<button type="button" onclick="entrar()">Entrar</button>
	</div>

	<script src="js/api.js"></script>
	<script src="js/login.js"></script>
</body>
</html>
